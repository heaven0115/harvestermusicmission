<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390px 확인용</title>
<style>
  html,body{margin:0;background:#cfd6de}
  iframe{width:390px;height:1500px;border:0;background:#fff;display:block;margin:0 auto}
</style>
</head>
<body>
<iframe id="f" src="./index.html?v=12"></iframe>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var b = d.body;
      b.setAttribute('data-tab', 'preview');
      Array.prototype.forEach.call(d.querySelectorAll('.tab'), function (x) {
        x.classList.toggle('active', x.getAttribute('data-tab') === 'preview');
      });
    } catch (e) {}
  });
</script>
</body>
</html>
