<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b4a6f">
<title>사역보고서 · 유효석 목사</title>
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body data-tab="log">

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">📋</span>
      <div class="brand-txt">
        <h1>사역보고서</h1>
        <p class="sub" id="saveState">자동 저장</p>
      </div>
    </div>

    <div class="weekbar">
      <button id="prevWeek" class="icon-btn" aria-label="이전 주">◀</button>
      <button id="weekLabel" class="weekchip" title="이번 주(지난 화~주일)로 이동">—</button>
      <button id="nextWeek" class="icon-btn" aria-label="다음 주">▶</button>
      <button id="thisWeek" class="ghost small">이번 주</button>
      <label class="submit-field">
        <span>제출일</span>
        <input type="date" id="submitDate">
        <b id="submitFmt">—</b>
      </label>
    </div>

    <div class="actions">
      <button id="btnDocx" class="primary">📄 워드 저장</button>
      <button id="btnPrint">🖨️ 인쇄 / PDF</button>
      <button id="btnMail">✉️ 이메일</button>
      <button id="btnBackup" class="ghost">백업</button>
      <button id="btnRestore" class="ghost">복원</button>
      <input type="file" id="fileRestore" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="log" role="tab">✍️ 사역 기록</button>
  <button class="tab" data-tab="visit" role="tab">🙏 심방 내용</button>
  <button class="tab" data-tab="preview" role="tab">📄 보고서</button>
</nav>

<main class="layout">

  <section class="panel panel-log" aria-label="일일 사역 기록">
    <div class="panel-head">
      <h2>날짜별 사역 기록</h2>
      <p class="hint">날짜를 고르고 그날 한 일을 적으면 오른쪽 보고서의 그 날짜 칸에 바로 들어갑니다.</p>
    </div>

    <div class="quickadd">
      <select id="qDate" aria-label="날짜 선택"></select>
      <input id="qText" type="text" placeholder="예: 수요새벽예배 설교" autocomplete="off">
      <button id="qAdd" class="primary">추가</button>
    </div>

    <div id="dayList" class="day-list"></div>

    <div class="panel-foot">
      <button id="btnFillWeek" class="ghost">📅 주간 날짜 다시 세팅 (화~주일)</button>
    </div>
  </section>

  <section class="panel panel-visit" aria-label="주간 심방 내용">
    <div class="panel-head">
      <h2>주간 심방 내용</h2>
      <p class="hint">담임목사님이 알아야 할 내용과 심방이 필요한 항목을 적어 주세요.</p>
    </div>

    <div class="chips" id="visitChips"></div>

    <div id="visitList" class="visit-list"></div>

    <div class="panel-foot">
      <button id="btnAddVisit" class="ghost">＋ 새 항목 추가</button>
    </div>
  </section>

  <section class="panel panel-preview" aria-label="보고서 미리보기">
    <div class="preview-head">
      <div class="preview-title">
        <strong>보고서 미리보기</strong>
        <span id="previewMeta" class="hint"></span>
      </div>
      <div class="preview-tools">
        <button id="btnZoom" class="ghost small">100%</button>
        <button id="btnDocx2" class="primary small">워드 저장</button>
        <button id="btnPrint2" class="small">인쇄 / PDF</button>
      </div>
    </div>
    <p class="preview-hint">표 안의 글자를 눌러 그 자리에서 바로 고칠 수 있습니다. 인쇄 창에서 “PDF로 저장”을 고르면 PDF가 됩니다. (US Letter · 여백 0.5인치)</p>
    <div class="paper-scroll" id="paperScroll">
      <div class="paper-scale" id="paperScale">
        <div class="paper" id="paper">
          <table class="report" id="reportTable">
            <colgroup>
              <col class="col-a"><col class="col-b"><col class="col-c"><col class="col-d">
            </colgroup>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- 이메일 모달 -->
<div class="modal" id="mailModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mailTitle">
    <div class="modal-head">
      <h2 id="mailTitle">✉️ 이메일 보내기</h2>
      <button id="mailClose" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <label class="field"><span>받는 사람</span>
      <input id="mailTo" type="email" inputmode="email" placeholder="name@example.com" autocomplete="email"></label>
    <label class="field"><span>참조 (선택)</span>
      <input id="mailCc" type="email" inputmode="email" placeholder="(없으면 비워 두세요)" autocomplete="email"></label>
    <label class="field"><span>제목</span>
      <input id="mailSubject" type="text"></label>
    <label class="field"><span>본문</span>
      <textarea id="mailBody" rows="14" spellcheck="false"></textarea></label>
    <div class="modal-actions">
      <button id="copySubject" class="ghost">제목 복사</button>
      <button id="copyBody" class="ghost">본문 복사</button>
      <button id="openMail" class="primary">메일 앱 열기</button>
    </div>
    <p class="modal-note">메일 앱이 열리면 내용을 확인한 뒤 보내 주세요. 보낸 편지함에 기록이 남도록 참조에 본인 주소를 넣어도 좋습니다.</p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/jszip.min.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
