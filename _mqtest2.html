<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>PROBE</title>
<style>body{margin:0;font:12px ui-monospace,monospace;background:#eef2ef}#o{padding:6px;white-space:pre-wrap;background:#fff}
.row{display:flex;gap:14px;align-items:flex-start;padding:8px}iframe{border:1px solid #bbb;background:#fff}</style>
</head><body>
<div id="o">…</div>
<div class="row">
  <iframe id="fa" width="375" height="812" src="index.html?probe=a"></iframe>
  <iframe id="fb" width="820" height="900" src="index.html?probe=b"></iframe>
</div>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
async function run(f) {
  await wait(1600);
  const doc = f.contentDocument, win = f.contentWindow;
  const lib = doc.querySelector('.nav-item[data-tab="library"]');
  if (lib) lib.click();
  await wait(600);
  const row = doc.querySelector('.sermon-row, [data-id]');
  if (row && !doc.querySelector('.detail-body')) row.click();
  await wait(700);
  const rep = [];
  rep.push('w=' + f.width + ' view=' + (doc.querySelector('.detail-body') ? 'detail' : 'list') +
    ' docSW=' + doc.documentElement.scrollWidth + ' inner=' + win.innerWidth +
    ' topbar=' + (doc.querySelector('.topbar') ? doc.querySelector('.topbar').scrollWidth + '/' + doc.querySelector('.topbar').clientWidth : '-'));
  const containers = [];
  doc.querySelectorAll('*').forEach(el => {
    const cs = win.getComputedStyle(el);
    if ((cs.overflowX === 'hidden' || cs.overflowX === 'clip') && el.scrollWidth > el.clientWidth + 2 && el.clientWidth > 0) containers.push(el);
  });
  containers.slice(0, 4).forEach(el => {
    const cr = el.getBoundingClientRect();
    const hits = [];
    el.querySelectorAll('*').forEach(ch => {
      const c2 = win.getComputedStyle(ch);
      if (c2.textOverflow === 'ellipsis') return;
      const r = ch.getBoundingClientRect();
      if (r.width && r.right > cr.right + 1) hits.push(ch.tagName.toLowerCase() + (ch.id ? '#' + ch.id : '') + ' w=' + Math.round(r.width) + ' +' + Math.round(r.right - cr.right) + ' ' + (ch.textContent || '').slice(0, 10).replace(/\s+/g, ' '));
    });
    rep.push('  ' + el.tagName.toLowerCase() + '.' + (typeof el.className === 'string' ? el.className.trim().split(/\s+/)[0] : '') + ' cw=' + el.clientWidth + ' sw=' + el.scrollWidth + ' hits=' + hits.length + (hits.length ? '\n     ' + hits.slice(0, 3).join('\n     ') : ''));
  });
  return rep.join('\n');
}
(async () => {
  const a = await run(document.getElementById('fa'));
  const b = await run(document.getElementById('fb'));
  const txt = a + '\n' + b;
  document.getElementById('o').textContent = txt;
  window.__PROBE = txt;
})();
</script>
</body></html>
