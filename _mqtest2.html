<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>PROBE</title>
<style>body{margin:0;font:12px ui-monospace,monospace}#o{padding:6px;white-space:pre-wrap}iframe{border:1px solid #ccc}</style>
</head><body>
<div id="o">…</div>
<iframe id="f" width="375" height="812" src="index.html?probe=1"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const f = document.getElementById('f');
  await wait(2200);
  const doc = f.contentDocument, win = f.contentWindow;
  const lib = doc.querySelector('.nav-item[data-tab="library"]');
  if (lib) lib.click();
  await wait(600);
  let row = doc.querySelector('.sermon-row, .board-card, [data-id]');
  if (row) row.click();
  await wait(700);
  const report = [];
  report.push('view=' + (doc.querySelector('.detail-body') ? 'detail' : 'list') + ' docSW=' + doc.documentElement.scrollWidth + ' inner=' + win.innerWidth);
  const containers = [];
  doc.querySelectorAll('*').forEach(el => {
    const cs = win.getComputedStyle(el);
    if ((cs.overflowX === 'hidden' || cs.overflowX === 'clip') && el.scrollWidth > el.clientWidth + 2 && el.clientWidth > 0) containers.push(el);
  });
  containers.slice(0, 4).forEach(el => {
    const cr = el.getBoundingClientRect();
    const hits = [];
    el.querySelectorAll('*').forEach(ch => {
      const r = ch.getBoundingClientRect();
      if (r.width && r.right > cr.right + 1) {
        hits.push(ch.tagName.toLowerCase() + (ch.id ? '#' + ch.id : '') + '.' + (typeof ch.className === 'string' ? ch.className.trim().split(/\s+/).slice(0,2).join('.') : '') + ' w=' + Math.round(r.width) + ' right+=' + Math.round(r.right - cr.right) + ' txt=' + (ch.textContent || '').slice(0, 12).replace(/\s+/g, ' '));
      }
    });
    report.push(el.tagName.toLowerCase() + '.' + (typeof el.className === 'string' ? el.className.trim().split(/\s+/)[0] : '') + ' cw=' + el.clientWidth + ' sw=' + el.scrollWidth + ' hits=' + hits.length);
    hits.slice(0, 4).forEach(h => report.push('   ' + h));
  });
  document.getElementById('o').textContent = report.join('\n');
  window.__PROBE = report.join('\n');
})();
</script>
</body></html>
