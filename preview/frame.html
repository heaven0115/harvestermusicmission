<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>화면 폭 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#F1F3F2;font-family:sans-serif}
  #wrap{position:absolute;left:0;top:0;background:#fff;box-shadow:0 0 0 1px #ccc}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var w = +(q.get('w') || 390), h = +(q.get('h') || 1600), y = +(q.get('y') || 0);
    var f = document.getElementById('f');
    f.width = w; f.height = h;
    var stamp = '?t=' + Date.now();
    function grab(path) {
      return fetch(path + stamp, { cache: 'no-store' }).then(function (r) { return r.text(); });
    }
    Promise.all([grab('../index.html'), grab('../styles.css'), grab('../data.js'), grab('../app.js')])
      .then(function (a) {
        var html = a[0]
          .replace('<link rel="stylesheet" href="styles.css">', '<style>' + a[1] + '</style>')
          .replace('<script src="data.js"><\/script>', '<script>' + a[2] + '<\/script>')
          .replace('<script src="app.js"><\/script>', '<script>' + a[3] + '<\/script>');
        f.onload = function () {
          setTimeout(function () { try { f.contentWindow.scrollTo(0, y); } catch (e) {} }, 500);
        };
        f.srcdoc = html;
      });
  })();
</script>
</body>
</html>
