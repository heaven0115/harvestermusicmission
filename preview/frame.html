<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>화면 폭 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#F1F3F2;font-family:sans-serif}
  #wrap{position:absolute;left:0;top:0;background:#fff;box-shadow:0 0 0 1px #ccc}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var w = +(q.get('w') || 390), h = +(q.get('h') || 1600), y = +(q.get('y') || 0);
    var f = document.getElementById('f');
    f.width = w; f.height = h;
    f.src = '../index.html?preview=' + Date.now();
    f.onload = function () {
      setTimeout(function () { try { f.contentWindow.scrollTo(0, y); } catch (e) {} }, 500);
    };
  })();
</script>
</body>
</html>
